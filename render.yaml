services:
  - type: web
    name: trustlens-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false          # Set in Render dashboard
      - key: SECRET_KEY
        generateValue: true  # Render auto-generates
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: FRONTEND_URL
        sync: false          # Set to your Vercel frontend URL
      - key: BACKEND_URL
        sync: false          # Set to this service's public URL
      - key: YOLO_MODEL_PATH
        value: "yolo_model/best_v2.pt"
      - key: HF_SPACE_URL
        sync: false          # Optional HuggingFace Space URL
